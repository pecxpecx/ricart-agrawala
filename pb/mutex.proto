syntax = "proto3";

package mutex;
option go_package = "./pb";

service MutexService {
    // A node calls this on other nodes to request access to the Critical Section
    rpc RequestAccess(AccessRequest) returns (AccessReply) {}
}

message AccessRequest {
    int32 node_id = 1;
    int32 timestamp = 2;
}

message AccessReply {
    bool granted = 1;
}